name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ENVIRONMENT: PYTEST
  PROJECT_NAME: nginx-log-analyzer
  JWT_SECRET_KEY: ci_only_secret_not_used_outside_tests
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: nginx_log_analyzer
  TEST_SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_nginx_log_analyzer

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.8.4

      - name: Ruff check
        run: ruff check apps tests migrations cli.py --output-format=github

      - name: Ruff format check
        run: ruff format --check apps tests migrations cli.py

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nginx_log_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE test_nginx_log_analyzer;'

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --cov=apps --cov-config .coveragerc
