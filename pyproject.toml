[project]
name = "nginx-log-analyzer"
version = "0.1.1"
description = "Сервис разбора и анализа access-логов nginx"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Artem Bukarev" },
]
dependencies = [
    "asyncpg==0.30.0",
    "fastapi[all]==0.115.6",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.13.3",
    "orjson==3.10.13",
    "loguru==0.7.3",
    "pydantic-settings==2.0.2",
    "aiofiles==24.1.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.21.2",
    "pytest-alembic==0.11.1",
    "pytest-cov==4.1.0",
    "pytest-httpx==0.34.0",
    "pytest-mock==3.14.0",
    "mypy==1.4.1",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
    "types-aiofiles==24.1.0.20241221",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.mypy]
python_version = "3.11"
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "handlers: marks tests as API handlers",
    "integration: marks tests as integration tests",
    "services: marks tests as service layer tests",
    "cli: marks tests as CLI command tests",
    "schemas: marks tests as schema validation tests",
]

[tool.virtualenvs]
in-project = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "env",
]

[tool.ruff.lint]
select = [
    "E", # PyCodeStyle errors
    "W", # PyCodeStyle warnings
    "I", # isort
    "N", # pep8-naming
    "F", # Pyflakes
    "UP", # pyupgrade
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "B", # flake8-bugbear
    "ASYNC", # flake8-asynс
    "G", # flake8-logging-forma
    "DTZ", # flake8-datetimez раскоментить после рефакторинг
    "D", # - докстринги - самый душный линтер
    "RUF", # Ruff-specific rules
    "ANN", # - neccecary type hints (undocument foo)
]
ignore = [
    "ANN001",
    "ANN201",
    "ANN206",
    "ANN204",
    "ANN002",
    "ANN003",
    "ANN401",
    "D100",
    "D101",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "N805",
    "N806",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]
extend-select = [
    "B006", # mutable-argument-default
    "PIE794", # duplicate-class-field-definition
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
force-wrap-aliases = true
force-single-line = true
combine-as-imports = false
lines-between-types = 1

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"migrations/*.py" = ["D", "E402", "E501", "ANN"]
"tests/*.py" = ["D", "DTZ", "E501", "ANN", "ASYNC230", "ASYNC240"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false




